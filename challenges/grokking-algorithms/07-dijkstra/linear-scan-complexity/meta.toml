id = "ga-linear-scan-complexity"
title = "Поиск минимума перебором"
difficulty = "medium"
type = "complexity"
tags = ["алгоритм Дейкстры", "O-большое"]
order = 50
hints = [
  "Сколько раз выполняется внешний цикл while? Каждый раз одна вершина становится обработанной.",
  "Сколько стоит find_lowest при V вершинах? А сколько всего раз выполняется обновление соседей, если сложить по всем вершинам?",
]

[complexity]
options = ["O(V + E)", "O((V + E) log V)", "O(V²)", "O(V³)"]
answer = "O(V²)"
explanation = """
Цикл выполняется V раз, и каждый раз find_lowest просматривает все V вершин — это O(V²). \
Обновления соседей в сумме занимают O(E), а рёбер не больше V², поэтому O(V² + E) = O(V²). \
Если хранить кандидатов в очереди с приоритетом (heapq), выйдет O((V + E) log V) — это быстрее на разреженных графах.
"""
