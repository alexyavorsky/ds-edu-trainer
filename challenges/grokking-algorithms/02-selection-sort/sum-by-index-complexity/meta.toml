id = "ga-sum-by-index-complexity"
title = "Сумма через чтение по индексу"
difficulty = "medium"
type = "complexity"
tags = ["связанные списки", "O-большое"]
order = 60
hints = [
  "Сколько шагов делает get(head, i) для конкретного i?",
  "Сложите шаги для i = 0, 1, …, n − 1. Похожую сумму вы видели в разборе сортировки выбором.",
]

[complexity]
options = ["O(n)", "O(n log n)", "O(n²)", "O(2ⁿ)"]
answer = "O(n²)"
explanation = """
get(head, i) каждый раз идёт от головы и делает i шагов. \
Всего 0 + 1 + … + (n − 1) = n(n − 1)/2 шагов. Константы отбрасываются — O(n²). \
Для массива тот же код работал бы за O(n): чтение по индексу там O(1). \
А по связанному списку правильно идти один раз: node = node.next.
"""
