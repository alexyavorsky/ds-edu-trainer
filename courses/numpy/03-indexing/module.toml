title = "Индексы и срезы"
summary = "Как достать из массива отдельный элемент, кусок, строку или столбец таблицы, изменить их и поменять форму массива."
outcomes = [
  "брать элементы и срезы: <code>a[i]</code>, <code>a[-1]</code>, <code>a[start:stop:step]</code>",
  "работать с таблицей: элемент <code>a[i, j]</code>, строка <code>a[i]</code>, столбец <code>a[:, j]</code>, блок",
  "понимать, когда изменение среза меняет исходный массив, и делать копию: <code>copy()</code>",
  "менять форму: <code>reshape</code>, <code>ravel</code>, <code>.T</code>",
]
