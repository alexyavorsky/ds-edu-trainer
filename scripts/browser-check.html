<!doctype html>
<meta charset="utf-8" />
<title>Проверка Python в браузере</title>
<!--
  Страница для scripts/validate_browsers.ts: запускает воркер production-сборки сайта (dist/) — тот же код,
  что на страницах задач, — и выполняет в нём задачи и уроки из only (через запятую) или пробы глубины
  рекурсии (probes — их имена через запятую). Результат — window.__result. Пробы грузят Pyodide с jsDelivr, как сайт; задачи и
  уроки — с зеркала validate_browsers.ts (тот же воркер, адрес Pyodide заменён на локальный).
-->
<pre id="log"></pre>
<script type="module">
  // журнал — и на странице, и в консоль: validate_browsers.ts собирает его по мере выполнения, поэтому он
  // сохраняется, даже если процесс страницы упадёт
  const log = (s) => {
    document.getElementById('log').textContent += s + '\n';
    console.log(`[check] ${s}`);
  };
  /** Только в журнал (не на страницу): что начато — по нему видно, где остановилась упавшая страница. */
  let workers = 0;
  const trace = (s) => console.log(`[check] · ${s}`);
  const params = new URLSearchParams(location.search);
  const [worker, tasks, config, lessons] = await Promise.all(['/__check/worker', '/__check/tasks.json', '/__check/config.json', '/__check/lessons.json'].map((u) => fetch(u)));
  const workerUrls = await worker.json();
  const allTasks = await tasks.json();
  const allLessons = await lessons.json();
  const { timeoutFactor, defaultTestTimeout, probes, lessonTimeout } = await config.json();
  const only = (params.get('only') || '').split(',').filter(Boolean);
  const probeNames = (params.get('probes') || '').split(',').filter(Boolean);
  const withProbes = probeNames.length > 0;
  const workerUrl = withProbes ? workerUrls.cdn : workerUrls.mirror;

  /** Один воркер; при таймауте или падении завершается, как на сайте. */
  class Python {
    constructor() {
      this.worker = new Worker(workerUrl, { type: 'module' });
      workers++;
      this.listeners = new Set();
      this.worker.onmessage = (e) => this.listeners.forEach((l) => l(e.data));
      this.worker.onerror = (e) => {
        e.preventDefault();
        this.listeners.forEach((l) => l({ type: 'fatal', runId: -1, message: e.message }));
      };
      this.ready = new Promise((resolve, reject) =>
        this.listeners.add((m) => (m.type === 'ready' ? resolve() : m.type === 'load-error' ? reject(new Error(m.message)) : 0)),
      );
      this.nextId = 1;
    }
    stop() {
      this.worker.terminate();
    }
    run(request) {
      const id = this.nextId++;
      return new Promise((resolve) => {
        let tests = null;
        let timer;
        const finish = (end) => {
          clearTimeout(timer);
          this.listeners.delete(listener);
          resolve(end);
        };
        const arm = (seconds) => {
          clearTimeout(timer);
          timer = setTimeout(() => finish({ type: 'timeout', seconds }), seconds * 1000);
        };
        const listener = (m) => {
          if (m.type === 'fatal' && (m.runId === id || m.runId === -1)) return finish({ type: 'crash', message: m.message });
          if (m.runId !== id) return;
          if (m.type === 'started') arm(request.kind === 'task' ? defaultTestTimeout * timeoutFactor : 30);
          if (m.type === 'tests') tests = m.tests;
          if (m.type === 'test-start') arm((tests?.[m.index]?.timeout ?? defaultTestTimeout) * timeoutFactor);
          if (m.type === 'test') arm(defaultTestTimeout * timeoutFactor);
          if (m.type === 'done') finish({ type: 'done', data: m });
          if (m.type === 'package-error') finish({ type: 'package-error', message: m.message });
        };
        this.listeners.add(listener);
        this.worker.postMessage({ type: 'run', request: { ...request, runId: id } });
      });
    }
  }

  const result = { probes: {}, tasks: [], lessons: [], restarts: [], userAgent: navigator.userAgent };

  /**
   * Новый воркер с загруженным Python; не запустился — до двух повторов после паузы, каждый попадает в отчёт.
   * Страховка от сбоя среды: JavaScriptCore на виртуальных машинах macOS arm64 в CI изредка (~0,1–0,3 % запусков)
   * падает при запуске Pyodide — «Out of bounds memory access», «access to a null reference» и т.п.
   * (docs/ARCHITECTURE.md, «CI»). Детерминированная ошибка загрузки повторится трижды и останется ошибкой.
   */
  async function startPython(where) {
    for (let attempt = 1; ; attempt++) {
      const py = new Python();
      try {
        await py.ready;
        return py;
      } catch (error) {
        py.stop();
        if (attempt === 3) throw error;
        result.restarts.push(`${where}: ${error.message}`);
        log(`повторный запуск Python (${where}): ${error.message}`);
        await new Promise((r) => setTimeout(r, 2000));
      }
    }
  }
  try {
    // Пробы: до какой глубины каждый вид рекурсии работает, а где Python падает целиком (стек WebAssembly)
    for (const [name, { depths, code }] of Object.entries(probes).filter(([name]) => probeNames.includes(name))) {
      result.probes[name] = {};
      for (const depth of depths) {
        const py = await startPython(`проба ${name}`);
        const end = await py.run({ kind: 'example', packages: [], setup: '', code: code.replaceAll('DEPTH', String(depth)), filename: 'probe.py', cell: name });
        py.stop();
        const outcome = end.type === 'done' ? (end.data.error ? end.data.error.type : 'ok') : end.type;
        result.probes[name][depth] = outcome;
        if (outcome !== 'ok') break;
      }
      log(`${name}: ${JSON.stringify(result.probes[name])}`);
    }
    // Задачи: у каждой свой воркер — как на сайте, где у страницы задачи свой
    for (const task of allTasks.filter((t) => only.includes(t.id))) {
      trace(`задача ${task.id} (воркер №${workers + 1})`);
      const py = await startPython(`задача ${task.id}`);
      for (const [variant, code] of task.variants) {
        const end = await py.run({ kind: 'task', packages: task.packages, code, footer: task.footer });
        let status = end.type;
        if (end.type === 'done') {
          const failed = (end.data.results ?? []).filter((r) => r.status !== 'passed');
          status = end.data.phase !== 'tests' ? `${end.data.phase}: ${end.data.error?.message}` : failed.length ? failed.map((r) => `«${r.title}»: ${r.message}`).join('; ') : 'passed';
        } else if (end.message) {
          status += `: ${end.message}`;
        }
        result.tasks.push({ id: task.id, variant, status });
        if (status !== 'passed') log(`✗ ${task.id} ${variant}: ${status}`);
        if (end.type !== 'done') break;
      }
      py.stop();
    }
    // Уроки курсов: все ячейки с эталонами по порядку в одном сеансе, как их выполняет страница урока.
    // На урок — не больше lessonTimeout секунд (вместе с запуском Python): зависший урок останавливается,
    // в отчёт идёт последняя начатая ячейка, остальные уроки проверяются дальше.
    const same = (a, b) => JSON.stringify([a.lines, a.result, a.error]) === JSON.stringify([b.lines, b.result, b.error]);
    for (const lesson of allLessons.filter((l) => only.includes(l.id))) {
      const started = performance.now();
      const at = { cell: 'запуск Python', kind: 'start' }; // последняя начатая ячейка
      let py = null;
      let expired = false;
      const work = (async () => {
        trace(`урок ${lesson.id} (воркер №${workers + 1})`);
        const fresh = await startPython(`урок ${lesson.id}`);
        if (expired) return fresh.stop();
        py = fresh;
        for (const step of lesson.steps) {
          const { expected, raises, ...rest } = step;
          at.cell = step.cell;
          at.kind = step.op;
          trace(`${lesson.id}: ${step.op} ${step.cell}`);
          const end = await py.run({ kind: 'lesson', lesson: lesson.id, session: 'browser', files: lesson.files, packages: lesson.packages, ...rest });
          if (expired) return;
          let status = 'passed';
          if (end.type !== 'done') status = `${end.type}${end.message ? `: ${end.message}` : ''}`;
          else if (step.op === 'check') {
            const bad = (end.data.results ?? []).filter((r) => r.status !== 'passed');
            if (end.data.phase !== 'tests') status = `${end.data.phase}: ${end.data.error?.text ?? end.data.results?.[0]?.title}`;
            else if (bad.length) status = bad.map((r) => `«${r.title}»: ${r.message}`).join('; ');
          } else {
            const got = { lines: end.data.lines, result: end.data.result, error: end.data.error?.text ?? null };
            if (end.data.error && !(raises && end.data.error.mro.includes(raises))) status = end.data.error.text;
            else if (raises && !end.data.error) status = `ожидалась ошибка ${raises}`;
            else if (expected && !same(got, expected)) status = `вывод отличается от сохранённого: ${JSON.stringify(got).slice(0, 300)}`;
          }
          result.lessons.push({ id: lesson.id, cell: step.cell, status });
          if (status !== 'passed') log(`✗ ${lesson.id} ${step.cell}: ${status}`);
          if (end.type !== 'done') break;
        }
        return 'done';
      })();
      let timer;
      const outcome = await Promise.race([work, new Promise((resolve) => (timer = setTimeout(() => resolve('expired'), lessonTimeout * 1000)))]);
      clearTimeout(timer);
      if (outcome === 'expired') {
        expired = true;
        work.catch(() => {}); // запуск Python, завершившийся ошибкой уже после остановки, не важен
        const seconds = Math.round((performance.now() - started) / 1000);
        result.lessons.push({ id: lesson.id, cell: at.cell, kind: at.kind, status: 'lesson-timeout', seconds, limit: lessonTimeout });
        log(`✗ ${lesson.id}: не уложился в ${lessonTimeout} с, последняя начатая ячейка — ${at.cell} (${seconds} с)`);
      }
      py?.stop();
      log(`урок ${lesson.id}: ${outcome === 'expired' ? 'остановлен по времени' : 'выполнен'}`);
    }
  } catch (error) {
    result.error = String(error);
  }
  log('готово');
  window.__result = result;
</script>
