id = "ga-two-passes-complexity"
title = "Два прохода по ценам"
difficulty = "easy"
type = "complexity"
tags = ["O-большое", "константы"]
order = 20
hints = [
  "Сколько раз выполняется тело каждого цикла?",
  "Константы в «O-большом» не записываются. Чем тогда O(2n) отличается от O(n)?",
]

[complexity]
options = ["O(log n)", "O(n)", "O(n log n)", "O(n²)"]
answer = "O(n)"
explanation = """
Циклы идут друг за другом, а не один внутри другого. Всего получается n + n = 2n шагов. \
Константы в «O-большом» отбрасываются, поэтому O(2n) — то же самое, что O(n), и так не пишут. \
O(n²) было бы, если бы второй цикл был вложен в первый.
"""
