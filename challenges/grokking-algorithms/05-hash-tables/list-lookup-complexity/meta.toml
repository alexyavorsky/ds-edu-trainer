id = "ga-list-lookup-complexity"
title = "Уникальные гости через список"
difficulty = "easy"
type = "complexity"
tags = ["хеш-таблицы", "O-большое"]
order = 30
hints = [
  "Сколько времени занимает проверка name in unique, если unique — это список?",
  "Сколько раз выполняется эта проверка и какой длины может быть список unique?",
]

[complexity]
options = ["O(n)", "O(n log n)", "O(n²)", "O(1)"]
answer = "O(n²)"
explanation = """
Проверка x in list просматривает список подряд — O(длины списка). В худшем случае (все имена разные) список дорастает до n. \
Всего 0 + 1 + … + (n − 1) сравнений — O(n²). \
Если заменить список на множество set, проверка станет O(1) в среднем (это хеш-таблица), и вся функция — O(n).
"""
