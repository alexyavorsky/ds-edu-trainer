id = "ga-bfs-complexity"
title = "Время поиска в ширину"
difficulty = "easy"
type = "complexity"
tags = ["поиск в ширину", "O-большое"]
order = 30
hints = [
  "Сколько раз каждая вершина попадает в очередь? Здесь dist одновременно служит множеством проверенных.",
  "Сколько раз всего выполняется тело внутреннего цикла for, если сложить по всем вершинам?",
]

[complexity]
options = ["O(V)", "O(E)", "O(V + E)", "O(V · E)"]
answer = "O(V + E)"
explanation = """
Каждая вершина попадает в очередь не больше одного раза: проверка friend not in dist (хеш-таблица, O(1)) не пускает её повторно. Это даёт O(V). \
Внутренний цикл проходит по списку соседей каждой вершины один раз, а в сумме это все рёбра — O(E). \
Итого O(V + E): ни одно слагаемое нельзя отбросить, в разреженном графе рёбер мало, в плотном — очень много.
"""
