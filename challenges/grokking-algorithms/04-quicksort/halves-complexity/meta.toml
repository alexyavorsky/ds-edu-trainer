id = "ga-halves-complexity"
title = "Пополам и ещё раз пополам"
difficulty = "easy"
type = "complexity"
tags = ["разделяй и властвуй", "O-большое"]
order = 20
hints = [
  "Деление пополам ещё не означает O(log n). Важно, сколько вызовов получится всего.",
  "Нарисуйте дерево вызовов для n = 8. Сколько в нём листьев и сколько узлов всего?",
]

[complexity]
options = ["O(log n)", "O(n)", "O(n log n)", "O(n²)"]
answer = "O(n)"
explanation = """
Функция идёт в обе половины, а не в одну, как бинарный поиск. В дереве вызовов n листьев (по одному на элемент) и меньше n внутренних узлов — всего около 2n вызовов. \
Каждый вызов делает O(1) работы: срезов нет, передаются только индексы. Итого O(n). \
O(n log n) получилось бы, если бы каждый уровень делал O(n) работы — например, копировал срезы или сливал половины, как сортировка слиянием.
"""
