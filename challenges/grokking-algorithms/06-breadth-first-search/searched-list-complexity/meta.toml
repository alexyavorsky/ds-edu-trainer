id = "ga-searched-list-complexity"
title = "Проверенные вершины в списке"
difficulty = "medium"
type = "complexity"
tags = ["поиск в ширину", "хеш-таблицы", "O-большое"]
order = 60
hints = [
  "Сколько раз выполняется queue.popleft()? Вершина может попасть в очередь несколько раз — по разу на каждое входящее ребро.",
  "Сколько стоит проверка node in searched, когда searched — список длины до V?",
]

[complexity]
options = ["O(V + E)", "O(V · E)", "O(V²)", "O(E log V)"]
answer = "O(V · E)"
explanation = """
Здесь вершина добавляется в очередь при каждом просмотре ребра, ведущего в неё, поэтому извлечений из очереди — около E. \
Каждое извлечение проверяет node in searched по списку длиной до V — это O(V). Итого O(V · E). \
Чтобы получить O(V + E) из главы, searched должен быть множеством (set) — хеш-таблицей с проверкой за O(1).
"""
