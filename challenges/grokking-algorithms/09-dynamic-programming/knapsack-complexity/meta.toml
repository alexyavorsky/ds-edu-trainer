id = "ga-knapsack-complexity"
title = "Размер таблицы рюкзака"
difficulty = "easy"
type = "complexity"
tags = ["динамическое программирование", "задача о рюкзаке", "O-большое"]
order = 30
hints = [
  "Сколько в таблице строк и сколько столбцов?",
  "Сколько работы уходит на заполнение одной ячейки?",
]

[complexity]
options = ["O(n)", "O(n + W)", "O(n · W)", "O(2ⁿ)"]
answer = "O(n · W)"
explanation = """
В таблице n + 1 строк (предметы) и W + 1 столбцов (вместимость от 0 до W). Каждая ячейка заполняется за O(1): максимум из двух уже посчитанных значений. \
Итого O(n · W) — вместо O(2ⁿ) при переборе всех наборов. \
Время зависит от величины W, а не только от числа предметов, поэтому при огромной вместимости таблица тоже становится огромной.
"""
