id = "ga-search-in-loop-complexity"
title = "Бинарный поиск в цикле"
difficulty = "medium"
type = "complexity"
tags = ["O-большое", "бинарный поиск"]
order = 60
hints = [
  "Внешний цикл выполняется n раз. Сколько шагов делает внутренний while в худшем случае?",
  "Когда циклы вложены, их время перемножается.",
]

[complexity]
options = ["O(log n)", "O(n)", "O(n log n)", "O(n²)"]
answer = "O(n log n)"
explanation = """
Для каждого из n запросов выполняется бинарный поиск: в худшем случае это log n шагов. \
Внутренний цикл вложен во внешний, поэтому время перемножается: O(n × log n). \
Если бы вместо бинарного поиска был простой просмотр списка, получилось бы O(n²).
"""
