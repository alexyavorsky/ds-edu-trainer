id = "ga-subsets-complexity"
title = "Перебор всех подмножеств"
difficulty = "easy"
type = "complexity"
tags = ["NP-полные задачи", "O-большое"]
order = 20
hints = [
  "Сколько всего подмножеств у множества из n элементов? Каждый элемент либо входит, либо нет.",
  "Для каждого подмножества код ещё и суммирует его элементы — сколько это стоит в худшем случае?",
]

[complexity]
options = ["O(n²)", "O(n³)", "O(2ⁿ · n)", "O(n!)"]
answer = "O(2ⁿ · n)"
explanation = """
Подмножеств 2ⁿ (каждый предмет либо берём, либо нет), и для каждого сумма считается за O(n) — итого O(2ⁿ · n). \
Уже при n = 40 это больше триллиона шагов. Поэтому для NP-полных задач вроде этой на практике используют приближённые (например, жадные) алгоритмы. \
O(n!) — это перебор всех перестановок, как в задаче о коммивояжёре; он растёт ещё быстрее.
"""
