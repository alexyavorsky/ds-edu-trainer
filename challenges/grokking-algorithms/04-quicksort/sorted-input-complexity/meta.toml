id = "ga-sorted-input-complexity"
title = "Опорный из середины"
difficulty = "medium"
type = "complexity"
tags = ["быстрая сортировка", "средний и худший случай", "O-большое"]
order = 60
hints = [
  "Какой элемент окажется опорным, если список уже упорядочен и берётся средний элемент?",
  "На сколько частей и какого размера делится список на каждом уровне? Сколько всего уровней и сколько работы на каждом?",
]

[complexity]
options = ["O(n)", "O(n log n)", "O(n²)", "O(log n)"]
answer = "O(n log n)"
explanation = """
В упорядоченном списке средний элемент — медиана. Каждое разбиение делит список почти поровну, поэтому уровней рекурсии около log n. \
На каждом уровне все подсписки вместе содержат ~n элементов, и разбиение обходит их за O(n). Итого O(n log n) — это лучший случай. \
Будь опорным первый элемент, тот же вход дал бы худший случай: одна часть пустая, уровней n, всего O(n²).
"""
