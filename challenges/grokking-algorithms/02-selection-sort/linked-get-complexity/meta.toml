id = "ga-linked-get-complexity"
title = "Чтение по индексу из связанного списка"
difficulty = "easy"
type = "complexity"
tags = ["связанные списки", "O-большое"]
order = 20
hints = [
  "Можно ли сразу «прыгнуть» к узлу с номером index, как в массиве?",
  "Худший случай — последний элемент списка.",
]

[complexity]
options = ["O(1)", "O(log n)", "O(n)", "O(n²)"]
answer = "O(n)"
explanation = """
В связанном списке узел знает только адрес следующего, поэтому к элементу с номером index приходится идти от головы шаг за шагом. \
В худшем случае (последний элемент) это n − 1 шагов — O(n). \
У массива элементы лежат в памяти подряд, и чтение по индексу занимает O(1).
"""
