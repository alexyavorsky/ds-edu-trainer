id = "ga-staircase-complexity"
title = "Кирпичная лестница"
difficulty = "medium"
type = "complexity"
tags = ["стек вызовов", "O-большое"]
order = 60
hints = [
  "Рекурсивных вызовов n, но работа внутри каждого разная. Сколько шагов делает цикл в вызове с аргументом k?",
  "Сложите работу всех вызовов: n + (n − 1) + … + 1. Где вы видели такую сумму в главе 2?",
]

[complexity]
options = ["O(n)", "O(n log n)", "O(n²)", "O(2ⁿ)"]
answer = "O(n²)"
explanation = """
Вызовов n, но в вызове с аргументом k цикл делает k шагов. Всего n + (n − 1) + … + 1 = n(n + 1)/2 шагов. \
Это та же сумма, что у сортировки выбором в главе 2. Константа ½ в «O-большом» отбрасывается, остаётся O(n²). \
Ответ O(n) — частая ловушка: он был бы верным, если бы каждый вызов работал за O(1).
"""
