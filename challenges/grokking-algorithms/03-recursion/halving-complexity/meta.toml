id = "ga-halving-complexity"
title = "Сколько раз делим пополам"
difficulty = "easy"
type = "complexity"
tags = ["стек вызовов", "O-большое"]
order = 30
hints = [
  "Каждый вызов делает постоянный объём работы. Значит, всё решает количество вызовов.",
  "Посчитайте вызовы для n = 8, 16, 32. Как растёт их число при удвоении n?",
]

[complexity]
options = ["O(1)", "O(log n)", "O(n)", "O(n²)"]
answer = "O(log n)"
explanation = """
Каждый рекурсивный вызов уменьшает n вдвое, а работа внутри вызова постоянная. \
От n до 1 получается примерно log₂ n шагов — как у бинарного поиска из главы 1. \
При n = 1 000 000 будет всего около 20 вызовов, и столько же кадров окажется в стеке вызовов на пике.
"""
