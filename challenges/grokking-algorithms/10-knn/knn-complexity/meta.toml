id = "ga-knn-complexity"
title = "Сколько стоит один прогноз"
difficulty = "medium"
type = "complexity"
tags = ["k ближайших соседей", "O-большое"]
order = 60
hints = [
  "Сколько стоит посчитать одно расстояние, если у точки d признаков? А сколько таких расстояний?",
  "Не забудьте про сортировку списка из n расстояний.",
]

[complexity]
options = ["O(k)", "O(n · d)", "O(n · d + n log n)", "O(n² · d)"]
answer = "O(n · d + n log n)"
explanation = """
Расстояние до одной точки считается за O(d), до всех n точек — за O(n · d). Затем список из n расстояний сортируется за O(n log n). \
Голосование по k соседям — O(k), а k ≤ n, поэтому это слагаемое поглощается. Итого O(n · d + n log n). \
Каждый прогноз проходит по всей выборке, поэтому на больших данных k-NN медленный. Если вместо сортировки выбирать k минимальных (heapq.nsmallest), получится O(n · d + n log k).
"""
